name: harness
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python -m pip install -r harness/requirements-check.txt
      - name: Check documentation and contracts
        run: python harness/scripts/check.py
      - name: Report document review reminders
        run: python harness/scripts/doc_gardening.py
